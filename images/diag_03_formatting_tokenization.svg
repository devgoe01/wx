<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%"><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/></marker><marker id="a-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="900" height="500" fill="#ffffff"/><text x="450.0" y="32" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:20px;fill:#0f172a;font-weight:700" xml:space="preserve">Instruction Formatting and Tokenization Pipeline</text><text x="450.0" y="54" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#475569;font-weight:500" xml:space="preserve">A dataset entry becomes one prompt + response string, then a list of integer token IDs</text><rect x="20" y="80" width="200" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/><text x="32" y="102" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#334155;font-weight:700" xml:space="preserve">1. Dataset entry</text><text x="32" y="121" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">entry["instruction"]</text><text x="32" y="138" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">entry["input"]</text><text x="32" y="155" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">entry["output"]</text><line x1="222" y1="140" x2="262" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="266" y="80" width="610" height="244" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/><text x="280" y="102" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#0f172a;font-weight:700" xml:space="preserve">2. Alpaca-style prompt built by format_input(entry)  +  response</text><text x="282" y="126" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#64748b;font-weight:400" xml:space="preserve">Below is an instruction that describes a task. Write a response</text><text x="282" y="143" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#64748b;font-weight:400" xml:space="preserve">that appropriately completes the request.</text><text x="282" y="166" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#1d4ed8;font-weight:400" xml:space="preserve">### Instruction:</text><text x="282" y="183" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#1d4ed8;font-weight:400" xml:space="preserve">Identify the correct spelling of the following word.</text><text x="282" y="206" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#b45309;font-weight:400" xml:space="preserve">### Input:                      &lt;- only if entry["input"] is not empty</text><text x="282" y="223" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#b45309;font-weight:400" xml:space="preserve">Ocassion</text><text x="282" y="246" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#047857;font-weight:400" xml:space="preserve">### Response:                   &lt;- appended for training</text><text x="282" y="263" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#047857;font-weight:400" xml:space="preserve">The correct spelling is 'Occasion.'</text><rect x="280" y="292" width="12" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" /><text x="298" y="303" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:10.5px;fill:#64748b;font-weight:400" xml:space="preserve">preamble</text><rect x="366" y="292" width="12" height="12" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1" /><text x="384" y="303" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:10.5px;fill:#1d4ed8;font-weight:400" xml:space="preserve">instruction</text><rect x="462" y="292" width="12" height="12" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1" /><text x="480" y="303" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:10.5px;fill:#b45309;font-weight:400" xml:space="preserve">input (optional)</text><rect x="584" y="292" width="12" height="12" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="1" /><text x="602" y="303" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:10.5px;fill:#047857;font-weight:400" xml:space="preserve">response = target text</text><line x1="571" y1="326" x2="571" y2="370" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="580" y="352" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#7c3aed;font-weight:400" xml:space="preserve">tokenizer.encode(full_text)</text><rect x="20" y="378" width="856" height="104" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/><text x="34" y="400" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#581c87;font-weight:700" xml:space="preserve">3. Token IDs (GPT-2 BPE, vocabulary of 50,257 tokens)</text><rect x="34" y="412" width="50" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="59.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">Below</text><text x="59.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">21106</text><rect x="90" y="412" width="50" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="115.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">␣is</text><text x="115.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">318</text><rect x="146" y="412" width="50" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="171.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">␣an</text><text x="171.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">281</text><rect x="202" y="412" width="98" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="251.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">␣instruction</text><text x="251.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">12064</text><rect x="306" y="412" width="50" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="331.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">␣that</text><text x="331.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">326</text><rect x="362" y="412" width="84" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="404.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">␣describes</text><text x="404.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">8477</text><rect x="452" y="412" width="50" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="477.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">␣a</text><text x="477.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">257</text><rect x="508" y="412" width="50" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="533.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">␣task</text><text x="533.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">4876</text><rect x="564" y="412" width="50" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="589.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">.</text><text x="589.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">13</text><rect x="620" y="412" width="50" height="22" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1" /><text x="645.0" y="427" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:10.5px;fill:#334155;font-weight:400" xml:space="preserve">...</text><text x="645.0" y="452" text-anchor="middle" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#6d28d9;font-weight:700" xml:space="preserve">...</text><text x="34" y="474" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:10.5px;fill:#64748b;font-weight:400" xml:space="preserve">␣ marks a leading space: GPT-2 tokens usually include the space before a word.   &lt;|endoftext|&gt; = 50256 is added later by the collate function.</text></svg>