:#334155;font-weight:400" xml:space="preserve">greedy decoding</text><text x="386" y="140" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">max 256 new tokens</text><line x1="536" y1="123" x2="549" y2="123" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="551" y="82" width="160" height="82" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/><text x="563" y="104" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#581c87;font-weight:700" xml:space="preserve">decode</text><text x="563" y="123" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">token IDs -&gt; text</text><text x="563" y="140" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">token_ids_to_text()</text><line x1="713" y1="123" x2="726" y2="123" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="728" y="82" width="160" height="82" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/><text x="740" y="104" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#065f46;font-weight:700" xml:space="preserve">extract_response()</text><text x="740" y="123" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">drop prompt, header,</text><text x="740" y="140" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">&lt;|endoftext|&gt;</text><line x1="800" y1="166" x2="800" y2="196" stroke="#059669" stroke-width="2" marker-end="url(#a-emerald)"/><rect x="560" y="200" width="320" height="64" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/><text x="574" y="222" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:12px;fill:#065f46;font-weight:700" xml:space="preserve">instruction-data-with-response.json</text><text x="574" y="242" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">each test entry + "model_response" field</text><line x1="558" y1="232" x2="470" y2="232" stroke="#059669" stroke-width="2" marker-end="url(#a-emerald)"/><rect x="20" y="200" width="448" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" /><text x="34" y="222" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12px;fill:#0f172a;font-weight:700" xml:space="preserve">preds = model responses     refs = dataset "output"</text><text x="34" y="242" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">110 (prediction, reference) pairs are compared below</text><rect x="20" y="290" width="205" height="108" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/><text x="32" y="312" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#1e3a8a;font-weight:700" xml:space="preserve">Exact Match</text><text x="32" y="331" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">% of predictions identical</text><text x="32" y="348" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">to the reference string.</text><text x="32" y="365" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">Very strict.</text><rect x="238" y="290" width="205" height="108" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/><text x="250" y="312" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#78350f;font-weight:700" xml:space="preserve">BLEU (sacrebleu)</text><text x="250" y="331" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">n-gram precision (1-4 grams)</text><text x="250" y="348" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">against the reference,</text><text x="250" y="365" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">corpus level, 0-100.</text><rect x="456" y="290" width="205" height="108" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/><text x="468" y="312" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#581c87;font-weight:700" xml:space="preserve">ROUGE-L F1</text><text x="468" y="331" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">Longest common subsequence</text><text x="468" y="348" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">of words; rewards same</text><text x="468" y="365" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">content in the same order.</text><rect x="674" y="290" width="205" height="108" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/><text x="686" y="312" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#334155;font-weight:700" xml:space="preserve">BERTScore (optional)</text><text x="686" y="331" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">Semantic similarity using</text><text x="686" y="348" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">contextual embeddings;</text><text x="686" y="365" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">accepts paraphrases.</text><text x="450" y="428" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12px;fill:#475569;font-weight:400" xml:space="preserve">Each metric looks at a different aspect of quality: no single number tells the whole story.</text><text x="450" y="448" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12px;fill:#475569;font-weight:400" xml:space="preserve">Always read some generated responses yourself as well.</text></svg>