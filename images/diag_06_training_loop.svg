<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%"><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/></marker><marker id="a-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="900" height="520" fill="#ffffff"/><text x="450.0" y="32" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:20px;fill:#0f172a;font-weight:700" xml:space="preserve">One Fine-Tuning Step: Forward, Loss, Backward, Update</text><text x="450.0" y="54" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#475569;font-weight:500" xml:space="preserve">What train_model_simple() does for every batch, plus periodic evaluation</text><rect x="30" y="84" width="250" height="92" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/><text x="42" y="106" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;fill:#1e3a8a;font-weight:700" xml:space="preserve">1. Get a batch</text><text x="42" y="125" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">inputs, targets = next batch</text><text x="42" y="142" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">shape [8, T] each</text><rect x="325" y="84" width="250" height="92" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/><text x="337" y="106" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;fill:#581c87;font-weight:700" xml:space="preserve">2. Forward pass</text><text x="337" y="125" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">inputs [8, T] -&gt; GPT-2 -&gt; logits</text><text x="337" y="142" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">shape [8, T, 50257]</text><rect x="620" y="84" width="250" height="92" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/><text x="632" y="106" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;fill:#78350f;font-weight:700" xml:space="preserve">3. Loss</text><text x="632" y="125" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">cross-entropy: logits vs. targets</text><text x="632" y="142" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">(positions with -100 are ignored)</text><rect x="620" y="236" width="250" height="92" rx="10" fill="#fff1f2" stroke="#fb7185" stroke-width="1.5" filter="url(#shadow)"/><text x="632" y="258" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;fill:#881337;font-weight:700" xml:space="preserve">4. Backpropagation</text><text x="632" y="277" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">backpropagate the loss</text><text x="632" y="294" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">gradients for all 355M weights</text><rect x="325" y="236" width="250" height="92" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/><text x="337" y="258" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;fill:#065f46;font-weight:700" xml:space="preserve">5. Update weights</text><text x="337" y="277" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">AdamW updates every weight</text><text x="337" y="294" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">then gradients are reset</text><line x1="282" y1="130" x2="323" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="577" y1="130" x2="618" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="745" y1="178" x2="745" y2="234" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="618" y1="282" x2="577" y2="282" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><path d="M 323 282 L 155 282 L 155 178" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="160" y="300" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#64748b;font-weight:400" xml:space="preserve">next batch</text><rect x="30" y="352" width="410" height="148" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" /><text x="44" y="375" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#0f172a;font-weight:700" xml:space="preserve">Every eval_freq = 5 steps:  evaluate_model()</text><text x="52" y="397" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">• model.eval() + torch.no_grad()  (no updates)</text><text x="52" y="416" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">• train loss on eval_iter = 5 training batches</text><text x="52" y="435" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">• val loss on 5 validation batches</text><text x="52" y="454" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">• store in train_losses, val_losses, tokens_seen</text><text x="52" y="473" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">• model.train()  -&gt; back to training mode</text><rect x="460" y="352" width="420" height="148" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" /><text x="474" y="375" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#0f172a;font-weight:700" xml:space="preserve">End of every epoch:  print a sample response</text><text x="482" y="397" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">• generate() for format_input(val_data[0])</text><text x="482" y="416" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">• lets us watch the answers improve</text><text x="482" y="454" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">Settings:  num_epochs = 2,  batch_size = 8</text><text x="482" y="473" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">lr = 5e-5,  weight_decay = 0.1  -&gt;  2 x 116 = 232 steps</text></svg>