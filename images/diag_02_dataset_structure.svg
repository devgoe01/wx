<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%"><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/></marker><marker id="a-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="900" height="500" fill="#ffffff"/><text x="450.0" y="32" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:20px;fill:#0f172a;font-weight:700" xml:space="preserve">Structure of the Instruction-Response Dataset</text><text x="450.0" y="54" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#475569;font-weight:500" xml:space="preserve">Each record is a JSON object with three fields; the 1,100 records are split three ways</text><rect x="24" y="78" width="500" height="136" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/><text x="38" y="100" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#0f172a;font-weight:700" xml:space="preserve">data[50]  (with input)</text><text x="38" y="122" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#0f172a;font-weight:400" xml:space="preserve">{</text><text x="38" y="139" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#1d4ed8;font-weight:400" xml:space="preserve">  "instruction": "Identify the correct spelling of</text><text x="38" y="156" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#1d4ed8;font-weight:400" xml:space="preserve">                  the following word.",</text><text x="38" y="173" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#b45309;font-weight:400" xml:space="preserve">  "input":       "Ocassion",</text><text x="38" y="190" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#047857;font-weight:400" xml:space="preserve">  "output":      "The correct spelling is 'Occasion.'"</text><text x="38" y="207" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#0f172a;font-weight:400" xml:space="preserve">}</text><rect x="24" y="230" width="500" height="119" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/><text x="38" y="252" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#0f172a;font-weight:700" xml:space="preserve">data[999]  (empty input)</text><text x="38" y="274" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#0f172a;font-weight:400" xml:space="preserve">{</text><text x="38" y="291" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#1d4ed8;font-weight:400" xml:space="preserve">  "instruction": "What is an antonym of 'complicated'?",</text><text x="38" y="308" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#b45309;font-weight:400" xml:space="preserve">  "input":       "",</text><text x="38" y="325" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#047857;font-weight:400" xml:space="preserve">  "output":      "An antonym of 'complicated' is 'simple'."</text><text x="38" y="342" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#0f172a;font-weight:400" xml:space="preserve">}</text><rect x="548" y="78" width="328" height="70" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/><text x="560" y="100" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:13px;fill:#1e3a8a;font-weight:700" xml:space="preserve">"instruction"</text><text x="560" y="120" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">The task the model must perform</text><text x="560" y="136" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">(always present).</text><rect x="548" y="158" width="328" height="70" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/><text x="560" y="180" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:13px;fill:#78350f;font-weight:700" xml:space="preserve">"input"</text><text x="560" y="200" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">Optional extra context for the task.</text><text x="560" y="216" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">Empty string "" when not needed.</text><rect x="548" y="238" width="328" height="70" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/><text x="560" y="260" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:13px;fill:#065f46;font-weight:700" xml:space="preserve">"output"</text><text x="560" y="280" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">The desired response. This is the</text><text x="560" y="296" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">text the model learns to produce.</text><text x="24" y="390" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#0f172a;font-weight:700" xml:space="preserve">Dataset split (order in the code: train -&gt; test -&gt; validation)</text><rect x="24" y="404" width="724.2" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="386.1" y="426" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12px;fill:#1e3a8a;font-weight:700" xml:space="preserve">train_data: 935 (85%)</text><rect x="748.2" y="404" width="85.2" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" /><rect x="833.4000000000001" y="404" width="42.6" height="34" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" /><text x="790.8000000000001" y="456" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#78350f;font-weight:700" xml:space="preserve">test_data: 110 (10%)</text><text x="874" y="474" text-anchor="end" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#581c87;font-weight:700" xml:space="preserve">val_data: 55 (5%)</text><text x="24" y="456" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#64748b;font-weight:400" xml:space="preserve">Total: 1,100 instruction-response records</text></svg>