<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%"><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/></marker><marker id="a-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="900" height="470" fill="#ffffff"/><text x="450.0" y="32" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:20px;fill:#0f172a;font-weight:700" xml:space="preserve">Training and Validation DataLoader Workflow</text><text x="450.0" y="54" text-anchor="middle" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#475569;font-weight:500" xml:space="preserve">Records -&gt; pre-tokenized dataset -&gt; batches padded by the custom collate function</text><rect x="20" y="80" width="150" height="92" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/><text x="32" y="102" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#1e3a8a;font-weight:700" xml:space="preserve">train_data</text><text x="32" y="121" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">935 records</text><line x1="172" y1="126" x2="202" y2="126" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="206" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/><text x="218" y="102" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#1e3a8a;font-weight:700" xml:space="preserve">InstructionDataset</text><text x="218" y="121" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">pre-tokenizes every entry</text><text x="218" y="138" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">__getitem__ -&gt; list of IDs</text><line x1="398" y1="126" x2="428" y2="126" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="432" y="80" width="250" height="92" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/><text x="444" y="102" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#1e3a8a;font-weight:700" xml:space="preserve">DataLoader(batch_size=8)</text><text x="444" y="121" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">shuffle=True, drop_last=True</text><text x="444" y="138" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">collate_fn=customized_collate_fn</text><text x="444" y="155" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">-&gt; 116 batches per epoch</text><line x1="684" y1="126" x2="714" y2="126" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="718" y="80" width="162" height="92" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/><text x="730" y="106" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:12.5px;fill:#1e3a8a;font-weight:700" xml:space="preserve">(inputs, targets)</text><text x="730" y="130" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">each [8, T] on device</text><text x="730" y="148" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">T = longest in batch</text><rect x="20" y="190" width="150" height="92" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/><text x="32" y="212" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:13px;fill:#581c87;font-weight:700" xml:space="preserve">val_data</text><text x="32" y="231" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">55 records</text><line x1="172" y1="236" x2="202" y2="236" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><rect x="206" y="190" width="190" height="92" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/><text x="218" y="212" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#581c87;font-weight:700" xml:space="preserve">InstructionDataset</text><text x="218" y="231" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">pre-tokenizes every entry</text><text x="218" y="248" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">__getitem__ -&gt; list of IDs</text><line x1="398" y1="236" x2="428" y2="236" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><rect x="432" y="190" width="250" height="92" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/><text x="444" y="212" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#581c87;font-weight:700" xml:space="preserve">DataLoader(batch_size=8)</text><text x="444" y="231" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">shuffle=False, drop_last=False</text><text x="444" y="248" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">collate_fn=customized_collate_fn</text><text x="444" y="265" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">-&gt; 7 batches</text><line x1="684" y1="236" x2="714" y2="236" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><rect x="718" y="190" width="162" height="92" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/><text x="730" y="216" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:12.5px;fill:#581c87;font-weight:700" xml:space="preserve">(inputs, targets)</text><text x="730" y="240" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">each [8, T] on device</text><text x="730" y="258" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">T = longest in batch</text><rect x="20" y="304" width="860" height="74" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/><text x="34" y="326" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:12.5px;fill:#78350f;font-weight:700" xml:space="preserve">customized_collate_fn  (the same function is used by both loaders)</text><text x="34" y="346" text-anchor="start" style="font-family:Consolas, 'JetBrains Mono', 'Courier New', monospace;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">partial(custom_collate_fn, device=device, allowed_max_length=1024)</text><text x="34" y="364" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11px;fill:#334155;font-weight:400" xml:space="preserve">Called on every list of 8 token-ID lists: adds &lt;|endoftext|&gt;, pads, builds shifted targets, masks padding with -100, moves to device.</text><rect x="20" y="396" width="860" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" /><text x="34" y="417" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#334155;font-weight:400" xml:space="preserve">test_data (110 records) is not batched: in Module 8 each test instruction is formatted and passed to generate() one at a time.</text><text x="34" y="436" text-anchor="start" style="font-family:Segoe UI, -apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;fill:#64748b;font-weight:400" xml:space="preserve">Example batch shapes from the train loader: [8, 61], [8, 76], [8, 73] ... T changes from batch to batch because padding is per batch.</text></svg>